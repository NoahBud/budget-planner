<!doctype html>
<html lang="fr" data-space="perso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notre budget">
<meta name="robots" content="noindex">
<title>Mon budget · Notre budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="brand"><svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><circle cx="10" cy="11" r="9" fill="var(--c-a)" opacity=".9"/><circle cx="20" cy="11" r="9" fill="var(--c-b)" opacity=".75"/></svg>
        Notre budget
      </div>
      <div class="sp"></div>
      <span class="sync" id="sync" hidden></span>
      <button class="iconbtn" id="btn-search" aria-label="Rechercher"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg></button>
      <button class="iconbtn" id="btn-settings" aria-label="Mon compte"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5"/></svg></button>
    </div>
    <nav class="spaces" id="spaces" aria-label="Pages"></nav>
    <div class="monthbar">
      <div class="month" id="month-label">—</div>
      <div class="arrows">
        <button class="iconbtn" id="prev" aria-label="Mois précédent"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="iconbtn" id="next" aria-label="Mois suivant"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="mois" aria-selected="true">Ce mois</button>
      <button role="tab" data-tab="fixes" aria-selected="false">Fixes</button>
      <button role="tab" data-tab="epargne" aria-selected="false">Épargne</button>
      <button role="tab" data-tab="tendances" aria-selected="false">Tendances</button>
    </div>
  </header>
  <main id="main"><div class="card"><div class="empty">Chargement…</div></div></main>
</div>
<button class="fab" id="fab" aria-label="Ajouter"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app/supabase.js"></script>
<script src="app/qrcode.js"></script>
<script src="app/app.js"></script>
<script>
/* Mises à jour : dès qu'une nouvelle version est en ligne, l'appli la récupère et se recharge toute seule
   (en attendant la fin d'une saisie en cours). La vérification se fait à l'ouverture et à chaque retour sur l'appli. */
if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller; let done = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had || done) return; done = true;
    const go = () => document.querySelector('#sheet-root .overlay') ? setTimeout(go, 1500) : location.reload();
    go();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
