<!doctype html>
<html lang="fr" data-space="commun">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notre budget">
<meta name="robots" content="noindex">
<title>Notre budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="wrap">
  <form class="login" id="login" novalidate>
    <div class="brand"><svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><circle cx="10" cy="11" r="9" fill="var(--c-a)" opacity=".9"/><circle cx="20" cy="11" r="9" fill="var(--c-b)" opacity=".75"/></svg> Notre budget</div>
    <div class="seg" role="tablist" aria-label="Mode">
      <label><input type="radio" name="mode" value="in" checked><span>Se connecter</span></label>
      <label><input type="radio" name="mode" value="up"><span>Créer mon compte</span></label>
    </div>
    <label class="field"><span>E-mail</span><input id="email" type="email" autocomplete="email" inputmode="email" required></label>
    <label class="field"><span>Mot de passe</span><input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit" id="submit" style="padding:14px">Se connecter</button>
    <p class="err" id="err" aria-live="polite"></p>
    <div class="banner" id="wait" hidden><b>Compte créé.</b> Il reste à le relier à votre budget : Noah s’en occupe une fois, depuis Supabase (étape 5 du guide). Ensuite, reconnectez-vous ici.</div>
  </form>
</div>
<script src="config.js"></script>
<script src="app/supabase.js"></script>
<script src="app/qrcode.js"></script>
<script src="app/login.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
